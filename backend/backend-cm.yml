 apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
data:
  PORT: "5000"
  
  # MySQL on RDS
  DB_HOST: "microservices-rds.c8rqsiyiazg5.us-east-1.rds.amazonaws.com"
  DB_PORT: "3306"
  DB_USER: "admin"
